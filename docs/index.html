<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadence — 予定表 & タスク管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">📅</span>
      <div class="brand-text">
        <h1>Cadence</h1>
        <p>予定表 &amp; タスク管理</p>
      </div>
    </div>
    <div class="header-actions">
      <span id="todayPill" class="today-pill"></span>
      <button id="themeToggle" class="theme-toggle" aria-label="テーマ切り替え" title="ライト/ダーク切り替え">
        <span class="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <section class="stats-row" id="statsRow">
    <div class="stat-card stat-events">
      <div class="stat-icon">🗓️</div>
      <div class="stat-body">
        <span class="stat-value" id="statEventsValue">0</span>
        <span class="stat-label">今月の予定</span>
      </div>
    </div>
    <div class="stat-card stat-tasks">
      <div class="stat-icon">📋</div>
      <div class="stat-body">
        <span class="stat-value" id="statTasksValue">0</span>
        <span class="stat-label">未完了タスク</span>
      </div>
    </div>
    <div class="stat-card stat-rate">
      <div class="stat-icon">✨</div>
      <div class="stat-body">
        <span class="stat-value" id="statRateValue">0%</span>
        <span class="stat-label">タスク完了率</span>
      </div>
      <div class="stat-progress"><div id="statRateBar" class="stat-progress-bar"></div></div>
    </div>
  </section>

  <main class="layout">

    <!-- カレンダー -->
    <section class="panel calendar-panel">
      <div class="calendar-toolbar">
        <button id="prevMonth" class="icon-btn" aria-label="前の月">‹</button>
        <h2 id="monthLabel"></h2>
        <button id="nextMonth" class="icon-btn" aria-label="次の月">›</button>
        <button id="todayBtn" class="today-btn">今日</button>
      </div>
      <div class="weekdays">
        <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>

    <div class="side-stack">
      <!-- 選択日の詳細 -->
      <section class="panel day-panel">
        <div class="panel-header">
          <h2 id="selectedDateLabel">日付を選択</h2>
          <button id="addEventBtn" class="primary-btn">＋ 予定を追加</button>
        </div>
        <ul id="eventList" class="event-list"></ul>
      </section>

      <!-- 時間割 -->
      <section class="panel timetable-panel">
        <div class="panel-header">
          <h2>時間割</h2>
        </div>
        <ul id="timetableList" class="timetable-list"></ul>
      </section>

      <!-- メモ -->
      <section class="panel memo-panel">
        <div class="panel-header">
          <h2>メモ</h2>
        </div>
        <textarea id="memoInput" class="memo-textarea" rows="4" maxlength="1000" placeholder="この日のメモを入力…"></textarea>
      </section>

      <!-- タスク管理 -->
      <section class="panel task-panel">
        <div class="panel-header">
          <h2>タスク</h2>
        </div>
        <form id="taskForm" class="task-form">
          <input type="text" id="taskTitle" placeholder="新しいタスクを入力…" required maxlength="120">
          <div class="task-form-row">
            <input type="date" id="taskDue">
            <select id="taskPriority">
              <option value="low">低</option>
              <option value="mid" selected>中</option>
              <option value="high">高</option>
            </select>
            <button type="submit" class="primary-btn">追加</button>
          </div>
        </form>
        <div class="task-filters">
          <button class="filter-btn active" data-filter="all">すべて</button>
          <button class="filter-btn" data-filter="active">未完了</button>
          <button class="filter-btn" data-filter="done">完了</button>
        </div>
        <ul id="taskList" class="task-list"></ul>
      </section>
    </div>

  </main>
</div>

<!-- 予定追加/編集モーダル -->
<div id="eventModal" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modalTitle">予定を追加</h3>
    <form id="eventForm">
      <label>種類
        <select id="eventCategory">
          <option value="">— 選択（任意） —</option>
          <option value="教員の業務">教員の業務</option>
          <option value="職員会議">職員会議</option>
          <option value="分掌部会">分掌部会</option>
          <option value="学部会">学部会</option>
          <option value="研究日">研究日</option>
          <option value="__custom">その他（自由入力）</option>
        </select>
      </label>
      <label>タイトル
        <input type="text" id="eventTitle" required maxlength="120" placeholder="例）打ち合わせ">
      </label>
      <div class="modal-row">
        <label>日付
          <input type="date" id="eventDate" required>
        </label>
        <label>時刻（任意）
          <input type="time" id="eventTime">
        </label>
      </div>
      <label>メモ（任意）
        <textarea id="eventNote" rows="3" maxlength="500" placeholder="詳細やリンクなど"></textarea>
      </label>
      <label>色ラベル
        <div class="color-options" id="colorOptions">
          <input type="radio" name="eventColor" value="#6366f1" id="c1" checked><label for="c1" style="background:#6366f1"></label>
          <input type="radio" name="eventColor" value="#16a34a" id="c2"><label for="c2" style="background:#16a34a"></label>
          <input type="radio" name="eventColor" value="#f59e0b" id="c3"><label for="c3" style="background:#f59e0b"></label>
          <input type="radio" name="eventColor" value="#ef4444" id="c4"><label for="c4" style="background:#ef4444"></label>
          <input type="radio" name="eventColor" value="#a855f7" id="c5"><label for="c5" style="background:#a855f7"></label>
          <input type="radio" name="eventColor" value="#0ea5e9" id="c6"><label for="c6" style="background:#0ea5e9"></label>
        </div>
      </label>
      <div class="modal-actions">
        <button type="button" id="deleteEventBtn" class="danger-btn hidden">削除</button>
        <div class="spacer"></div>
        <button type="button" id="cancelEventBtn" class="ghost-btn">キャンセル</button>
        <button type="submit" class="primary-btn">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js?v=6"></script>
</body>
</html>
